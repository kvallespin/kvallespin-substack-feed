name: Update Substack feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: update-substack-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feed repository
        uses: actions/checkout@v4

      - name: Check out canonical blog
        uses: actions/checkout@v4
        with:
          repository: kvallespin/kvallespin.github.io
          ref: main
          path: _source
          persist-credentials: false

      - name: Apply feed-only normalizations
        shell: bash
        run: |
          patch="$GITHUB_WORKSPACE/overrides/blog-normalization.patch"
          if git -C _source apply --check "$patch"; then
            git -C _source apply "$patch"
          elif git -C _source apply --reverse --check "$patch"; then
            echo "Normalizations already exist upstream."
          else
            echo "Normalization patch no longer applies cleanly."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/substack-requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement scripts/substack-requirements.txt

      - name: Run tests
        env:
          SUBSTACK_CONTENT_DIR: ${{ github.workspace }}/_source/content
        run: python -m pytest tests/test_substack_export.py -q

      - name: Generate feed
        run: |
          python scripts/substack_export.py \
            --content-dir _source/content \
            --output docs/substack-feed.xml \
            --manifest docs/substack-manifest.json

      - name: Commit updated feed
        shell: bash
        run: |
          if git diff --quiet -- docs/substack-feed.xml docs/substack-manifest.json; then
            echo "Feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/substack-feed.xml docs/substack-manifest.json
          git commit -m "update: regenerate Substack feed"
          git push
